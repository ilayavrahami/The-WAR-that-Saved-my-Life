<script>
const D={"chapters_he": [["Chapter One", "אדה סמית' חיה עם אמה, המכונה Mam, ועם אחיה הקטן ג'יימי בדירה קטנה בלונדון. אדה נולדה עם עיוות בכף הרגל, ואמה מתביישת בה ומתייחסת אליה באכזריות. היא מרביצה לה, מונעת ממנה לצאת מהבית ומשפילה אותה.\nאדה מבלה את רוב זמנה לבד, בזמן שג'יימי יוצא לשחק עם ילדים אחרים.", "אדה סובלת מהתעללות פיזית ונפשית.\nאמה גורמת לה להאמין שהיא חסרת ערך בגלל הרגל שלה.\nאדה מרגישה כלואה ובודדה.\nכבר בתחילת הספר רואים שאדה חזקה ונחושה, למרות החיים הקשים שלה.", "חשוב למבחן: להבין את נקודת הפתיחה של אדה"], ["Chapter Two", "אדה מבינה שג'יימי הולך ומתרחק ממנה. היא מפחדת להישאר לבד, ולכן מנסה למנוע ממנו לצאת. בשלב מסוים היא אפילו קושרת אותו כדי שלא יוכל לברוח.\nכשהיא רואה כמה הוא מפחד, היא מבינה שהיא מתנהגת כמו אמא שלהם. היא משחררת אותו ומחליטה שהיא חייבת ללמוד ללכת בעצמה.", "אדה אוהבת את ג'יימי, אבל הפחד שלה מהבדידות גורם לה להתנהג בצורה לא נכונה.\nהיא מבינה שהיא לא רוצה להפוך לאדם אכזרי כמו אמה.\nההחלטה ללמוד ללכת היא תחילת השינוי שלה.\nהמלחמה האישית שלה היא המאבק שלה נגד הפחד, הבדידות והמגבלות שהוטלו עליה.", ""], ["Chapter Three", "אדה מתחילה להתאמן בהליכה. היא נאחזת בכיסא, מנסה לעמוד ולצעוד, אך כל ניסיון גורם לה כאבים ונפילות. כף הרגל שלה מדממת והיא מתעייפת מאוד, אבל היא ממשיכה לנסות.\nהיא מסתירה את האימונים מאמה ומקווה שיום אחד תוכל ללכת כמו כולם.", "אדה מפגינה אומץ, כוח רצון והתמדה.\nהיא רוצה להוכיח לאמה שהיא מסוגלת לעשות דברים.\nההליכה מסמלת עצמאות וחופש.\nהיא עדיין מאמינה שאם תשתנה, אמה אולי תאהב אותה.", ""], ["Chapter Four", "אדה ממשיכה להתאמן, אך אמה מגלה שהיא מנסה ללכת ומענישה אותה. היא כולאת אותה בארון שמתחת לכיור, מקום מלוכלך ומלא ג'וקים.\nבאותו זמן מתברר שילדי לונדון עומדים להתפנות לכפר בגלל הסכנה של הפצצות הגרמנים. אמה מחליטה לשלוח את אדה וג'יימי, בעיקר מפני שהיא רוצה להיפטר מההוצאות הכרוכות בגידולם.", "אמה אינה שולחת את הילדים מתוך דאגה אמיתית, אלא מתוך אינטרס אישי.\nאדה עדיין נתונה להתעללות.\nהמלחמה מתחילה לשנות את חייהם של הילדים.\nהאירוע שממנו כולם מפחדים עומד להפוך להזדמנות של אדה להשתחרר.", ""], ["Chapter Five", "אדה וג'יימי מתכוננים לנסיעה. אדה אינה יודעת למה לצפות, והיא חוששת מהעולם שבחוץ, משום שכמעט לא יצאה מהדירה במשך שנים.\nהיא מבינה שהפינוי יפריד אותה מהמקום היחיד שהיא מכירה, אך גם עשוי לאפשר לה להיות חופשייה.", "אדה עומדת בפני שינוי גדול ולא מוכר.\nהיא מפחדת, אבל גם סקרנית.\nהקשר בין אדה לג'יימי חשוב מאוד: הם תומכים זה בזה.", ""], ["Chapter Six", "הילדים מגיעים לתחנת הרכבת יחד עם שאר הילדים שמתפנים מלונדון. אדה מרגישה שונה מהילדים האחרים, במיוחד בגלל הרגל שלה והעובדה שאין לה בגדים או ציוד כמו שלהם.\nהיא רואה ילדה רוכבת על פוני צהוב, והמראה הזה מעורר בה חלום: גם היא רוצה לרכוב על פוני.", "הפינוי מסמן את תחילת החיים החדשים של אדה.\nהפוני הופך לסמל של חופש ושל האפשרויות החדשות שנפתחות בפניה.\nאדה מתחילה לדמיין עתיד שונה מהחיים שהכירה.", ""], ["Chapter Seven", "אדה וג'יימי מגיעים לכפר ומגלים שהאישה שאמורה לקבל אותם, סוזן סמית', אינה מעוניינת בילדים. היא לא התכוננה לקבל אותם ואינה יודעת כיצד לטפל בהם.\nלמרות זאת, אדה וג'יימי נשארים אצלה. אדה מגלה שיש לה בית גדול, אמבטיה ואוכל – דברים שלא היו לה בלונדון.", "סוזן אינה רוצה להיות אחראית לילדים בתחילת הדרך.\nהיא אינה דומה לאמא של אדה, אך עדיין לא יודעת כיצד להראות חיבה.\nאדה מתקשה להאמין שמישהו עשוי לעזור לה בלי לפגוע בה.", ""], ["Chapter Eight", "סוזן מגלה את מצבה הגופני של אדה ואת העובדה שכף רגלה מעולם לא טופלה כראוי. היא לוקחת את הילדים לרופא, שמסביר שאדה סובלת מ-Clubfoot (כף רגל קלובה) ושמצבה נובע מהזנחה.\nהרופא ממליץ על טיפול ועל שימוש בקביים. אדה מגלה שהיא יכולה לנוע בעזרת הקביים בלי להכאיב לרגל הפגועה.", "אדה מבינה שהרגל שלה אינה אשמתה.\nסוזן מתחילה לדאוג לבריאותה.\nהקביים מאפשרים לאדה עצמאות שלא הייתה לה קודם.\nהטיפול הוא צעד חשוב בדרך להחלמה, גם מבחינה גופנית וגם מבחינה רגשית.", ""], ["Chapter Nine", "אדה מתחילה להכיר את הסביבה החדשה. היא מגלה את החצר, את הטבע ואת הפוני Butter. היא מתקרבת אליו ומרגישה איתו בנוח.\nהיא גם מתחילה להתרגל לכך שמותר לה לצאת מהבית ולחקור את העולם.", "Butter הוא מקור לאושר ולביטחון עבור אדה.\nהחיים בכפר שונים מאוד מהחיים בדירה הסגורה בלונדון.\nאדה מתחילה להבין שהיא יכולה לעשות דברים בעצמה.", ""], ["Chapter Ten", "אדה וסוזן ממשיכות להסתגל לחיים המשותפים. סוזן דואגת לאוכל, לניקיון ולצרכים של הילדים, אף על פי שהיא עדיין מתקשה להתמודד עם האחריות.\nאדה מתחילה להבין שסוזן אינה מתנהגת כמו אמה, אך היא עדיין חוששת לסמוך עליה.", "היחסים בין אדה לסוזן מתחילים להשתנות.\nסוזן לומדת להיות מטפלת ואדה לומדת לקבל עזרה.\nהאמון ביניהן נבנה בהדרגה ולא בבת אחת.", ""], ["Chapter Eleven", "אדה מתחילה להכיר את הכפר ואת האנשים שחיים בו. היא מגלה שיש אנשים שמוכנים לעזור לה ולהתייחס אליה בכבוד, בניגוד למה שחוותה בלונדון.", "אדה מתחילה להרגיש שהיא חלק מהעולם.\nהיא לומדת שלא כל האנשים אכזריים.\nהביטחון העצמי שלה מתחיל לגדול.", ""], ["Chapter Twelve", "אדה ממשיכה ללמוד כיצד להשתמש בקביים ולנוע בכוחות עצמה. היא מגלה שהחיים החדשים דורשים ממנה מאמץ, אך גם נותנים לה הזדמנויות שלא היו לה קודם.", "עצמאות היא אחד הנושאים המרכזיים בספר.\nאדה אינה מוותרת למרות הקשיים.\nהיא מתחילה לראות את עצמה כאדם מסוגל.", ""], ["Chapter Thirteen", "אדה מתקרבת יותר ל-Butter ולומדת להכיר אותו. הקשר ביניהם נותן לה תחושת חופש ושמחה. היא מתחילה להאמין שהיא יכולה לעשות דברים שבעבר נראו לה בלתי אפשריים.", "Butter מסמל את החופש שאדה מקבלת.\nהקשר עם הפוני עוזר לה לבנות ביטחון עצמי.\nאדה מתחילה להעז לחלום.", ""], ["Chapter Fourteen", "אדה מתחילה ללמוד ולגלות את העולם שמעבר לחוויות המצומצמות שהיו לה בבית. היא מגלה דברים חדשים על עצמה ועל היכולות שלה.", "החינוך והלמידה הם חלק מהחופש של אדה.\nהיא מתחילה להשלים פערים שנוצרו בגלל ההזנחה.\nהיא אינה מוגדרת רק על ידי המוגבלות שלה.", ""], ["Chapter Fifteen", "אדה מתחילה ליצור קשרים עם אנשים נוספים בכפר. היא לומדת שיש אנשים שמעריכים אותה בזכות מי שהיא ולא בגלל מצבה הגופני.", "קשרים חברתיים עוזרים לאדה להתפתח.\nהיא מתחילה להשתחרר מהבושה שהחדירה בה אמה.\nהיא לומדת שהיא ראויה לחברות ולכבוד.", ""], ["Chapter Sixteen", "אדה מתקדמת ברכיבה וביכולת שלה לטפל ב-Butter. היא לומדת להתמודד עם אתגרים חדשים ומרגישה גאה בהצלחות שלה.", "אדה הופכת לעצמאית יותר.\nהרכיבה היא הוכחה לכך שהמגבלה שלה אינה מונעת ממנה לחיות חיים מלאים.\nהיא מתחילה להאמין בעצמה.", ""], ["Chapter Seventeen", "אדה ממשיכה להסתגל לבית של סוזן. הקשר ביניהן נעשה מורכב יותר: מצד אחד סוזן דואגת לה, ומצד שני אדה מתקשה להאמין שהדאגה הזו אמיתית וקבועה.", "הטראומה של אדה משפיעה על הדרך שבה היא מפרשת אהבה ודאגה.\nהיא חוששת להיקשר לסוזן כי היא מאמינה שהשהות אצלה זמנית.", ""], ["Chapter Eighteen", "אדה מתחילה להבין שהיא יכולה להיות טובה בדברים רבים. היא מתקדמת בלמידה, ברכיבה ובחיי היום-יום.", "השינוי של אדה אינו רק גופני, אלא גם נפשי.\nהיא מתחילה להחליף את תחושת חוסר הערך בתחושת מסוגלות.", ""], ["Chapter Nineteen", "אדה ממשיכה לחוות את החיים בכפר ולפתח קשרים עם סוזן ועם האנשים שסביבה. היא מתחילה להרגיש שייכת, אך עדיין חוששת שהכול יסתיים כאשר אמה תחליט להחזיר אותה.", "הפחד שאדה תחזור ללונדון ממשיך להשפיע עליה.\nהיא עדיין מתקשה להאמין שמגיע לה להיות מאושרת.", ""], ["Chapter Twenty", "אדה ממשיכה להתקדם בחיים החדשים שלה. היא מגלה יותר על העולם, על אנשים ועל עצמה, ובמקביל מתמודדת עם הזיכרונות הקשים מהבית.", "העבר של אדה עדיין משפיע על ההתנהגות שלה.\nהחלמה מטראומה היא תהליך ארוך.\nהתמיכה של סוזן חשובה להתפתחות שלה.", ""], ["Chapter Twenty-one", "אדה ממשיכה ללמוד ולרכוש כישורים חדשים. היא מתחילה להבין שהחיים יכולים להיות יותר מאשר הישרדות ופחד.", "אדה מתחילה לבנות לעצמה זהות עצמאית.\nהיא לומדת להעריך את היכולות שלה.", ""], ["Chapter Twenty-two", "אדה מתמודדת עם הקשיים שבקשר עם סוזן ועם הפחד לאבד את הבית החדש שלה. היא עדיין לא בטוחה אם סוזן באמת רוצה בה.", "אדה מתקשה לקבל אהבה בגלל היחס שקיבלה מאמה.\nסוזן נאלצת ללמוד כיצד להתמודד עם הפחדים של אדה.", ""], ["Chapter Twenty-three", "אדה ממשיכה לפתח את כישוריה ואת עצמאותה. היא מתחילה להרגיש שהיא מסוגלת להתמודד עם מצבים שבעבר היו מפחידים אותה.", "התקדמותה של אדה נובעת מהתמדה ומהזדמנויות שניתנו לה.\nהיא מתחילה להאמין שהעתיד שלה יכול להיות שונה.", ""], ["Chapter Twenty-four", "אדה מתמודדת עם רגשות מורכבים: היא רוצה להישאר עם סוזן, אבל עדיין מרגישה מחויבת לאמה ומקווה שאמה תאהב אותה.", "אדה עדיין מחפשת את אהבת אמה, אף על פי שהיא פוגעת בה.\nהספר מראה עד כמה קשה להשתחרר מקשר משפחתי פוגעני.", ""], ["Chapter Twenty-five", "אדה ממשיכה לבנות את חייה החדשים. היא לומדת להכיר את עצמה ואת רגשותיה, ומתחילה להבין שהמשפחה אינה חייבת להיות רק האנשים שאליהם נולדים.", "אהבה יכולה להיבנות גם מחוץ למשפחה הביולוגית.\nסוזן הופכת בהדרגה לדמות אימהית עבור אדה.", ""], ["Chapter Twenty-six", "אדה ממשיכה להתקדם, אך הזיכרונות מהעבר והחשש מפני העתיד עדיין מלווים אותה.", "השינוי של אדה אינו קו ישר: יש רגעים של התקדמות וגם רגעים של פחד.\nחשוב להבין את ההשפעה של ההתעללות על הביטחון העצמי שלה.", ""], ["Chapter Twenty-seven", "אדה ממשיכה ללמוד ולחוות את החיים בכפר. היא נעשית בטוחה יותר בעצמה וביכולת שלה להתמודד עם העולם.", "אדה כבר אינה אותה ילדה חסרת אונים מתחילת הספר.\nהיא מפתחת אומץ ועצמאות.", ""], ["Chapter Twenty-eight", "אדה ממשיכה להעמיק את הקשר שלה עם האנשים שסביבה. היא לומדת לקבל עזרה, אך גם לעמוד על שלה.", "עצמאות אינה אומרת שאדם חייב לעשות הכול לבד.\nאדה לומדת שאפשר להיות חזקה וגם להיעזר באחרים.", ""], ["Chapter Twenty-nine", "אדה ממשיכה להתמודד עם החשש שהחיים הטובים שלה זמניים. היא מנסה להבין מה יהיה עתידה ומה יקרה אם אמה תדרוש שתחזור.", "הפחד מאובדן הביטחון ממשיך ללוות את אדה.\nהקשר שלה עם סוזן נעשה משמעותי יותר.", ""], ["Chapter Thirty", "אדה ממשיכה ללמוד על החיים ועל עצמה. היא מתחילה להכיר בכך שהיא ראויה לחיים טובים, אך עדיין מתקשה להאמין בכך באופן מלא.", "הערך העצמי של אדה נבנה בהדרגה.\nהספר מדגיש את חשיבותם של חינוך, אהבה ותמיכה.", ""], ["Chapter Thirty-one", "אדה ממשיכה לחוות את החיים בזמן מלחמת העולם השנייה. המלחמה משפיעה על חיי היומיום בכפר, על המזון ועל תחושת הביטחון של כולם.", "המלחמה היא הרקע המרכזי לסיפור, אך הסיפור עוסק גם במאבקים האישיים של הדמויות.\nהחיים בכפר אינם נטולי סכנות.", ""], ["Chapter Thirty-two", "אדה מתמודדת עם המציאות החדשה של המלחמה ועם השינויים בחיי המשפחה. היא ממשיכה לפתח עצמאות וללמוד כיצד להתמודד עם קשיים.", "אדה נעשית חזקה יותר מבחינה רגשית.\nהיא לומדת להתמודד עם מצבים שאין לה שליטה עליהם.", ""], ["Chapter Thirty-three", "אדה ממשיכה לבנות את הקשר שלה עם סוזן. היא מתחילה להבין שהדאגה של סוזן אמיתית, אך עדיין קשה לה לבטוח בכך לחלוטין.", "האמון הוא אחד הנושאים החשובים בהתפתחות של אדה.\nסוזן לומדת לאהוב את הילדים למרות שלא תכננה להיות אם.", ""], ["Chapter Thirty-four", "אדה מתקדמת בחייה החדשים וממשיכה להתמודד עם הזיכרונות והפחדים מהעבר.", "היא מתחילה להבין שהיא אינה חייבת להמשיך לחיות לפי מה שאמה אמרה עליה.\nהעבר אינו חייב לקבוע את העתיד שלה.", ""], ["Chapter Thirty-five", "אדה ממשיכה לחוות את הקשר המיוחד שלה עם Butter ועם האנשים בכפר. היא נעשית עצמאית יותר ומרגישה שייכת.", "Butter מסמל את החופש ואת הביטחון שאדה מצאה.\nאדה מגלה שהיא יכולה להתגבר על מגבלות רבות.", ""], ["Chapter Thirty-six", "אדה מתמודדת עם אירועים חדשים בזמן המלחמה. היא מגלה שהאומץ שלה אינו מתבטא רק בהתמודדות עם קשייה האישיים, אלא גם ביכולת לעזור לאחרים.", "אדה מתחילה לראות את עצמה כאדם שיכול לתרום.\nהיא עוברת מילדה שמפחדת מהעולם לילדה שמסוגלת לפעול בתוכו.", ""], ["Chapter Thirty-seven", "אדה ממשיכה להתמודד עם המצב הביטחוני ועם השינויים בחייה. היא לומדת להיות אמיצה גם כשהיא אינה יודעת מה יקרה בהמשך.", "אומץ אינו היעדר פחד, אלא היכולת לפעול למרות הפחד.\nאדה מתפתחת מבחינה נפשית.", ""], ["Chapter Thirty-eight", "אדה ממשיכה להתמודד עם הקשיים של תקופת המלחמה ועם החשש מפני חזרה לחיים הישנים.", "היא כבר יודעת מה הם חיים של חופש ואהבה, ולכן קשה לה יותר לחשוב על אובדנם.\nהקשר שלה עם סוזן חשוב במיוחד.", ""], ["Chapter Thirty-nine", "אדה ממשיכה להתקדם בחייה, אך המלחמה והעבר המשפחתי שלה עדיין משפיעים עליה.", "הספר מחבר בין המלחמה החיצונית לבין המאבק הפנימי של אדה.\nהיא לומדת להתמודד עם מצבים קשים בלי לוותר.", ""], ["Chapter Forty", "אדה מתקרבת לנקודת מפנה בחייה. היא כבר אינה הילדה שהייתה בתחילת הספר, והיא מסוגלת להתמודד עם אתגרים בצורה בוגרת יותר.", "השינוי שעברה אדה הוא אחד המסרים המרכזיים של הספר.\nהיא למדה שהיא ראויה לאהבה ולכבוד.", ""], ["Chapter Forty-one", "אדה ממשיכה להתמודד עם המציאות הקשה של המלחמה ועם ההחלטות הנוגעות לעתידה.", "אדה רוצה לשמור על החיים החדשים שבנתה.\nהיא כבר מסוגלת להבין מה טוב עבורה ומה מסכן אותה.", ""], ["Chapter Forty-two", "המצב נעשה מתוח יותר, והילדים נאלצים להתמודד עם האפשרות שהחיים שלהם ישתנו שוב.", "הביטחון שאדה מצאה בכפר עומד בפני מבחן.\nהיא נדרשת להתמודד עם פחדים ישנים.", ""], ["Chapter Forty-three", "אדה מתמודדת עם אירועים שמעמידים במבחן את האומץ ואת הנאמנות שלה לאנשים שהיא אוהבת.", "אדה כבר אינה פועלת רק מתוך פחד.\nהיא מסוגלת לקבל החלטות מתוך אהבה ואחריות.", ""], ["Chapter Forty-four", "אדה וג'יימי נאלצים להתמודד עם חזרה למציאות הקשה שממנה ניסו לברוח. הקשר שלהם והדברים שלמדו בתקופה אצל סוזן עומדים למבחן.", "ג'יימי ואדה תלויים זה בזה, אך אדה מבינה יותר ויותר שהיא יכולה להגן על עצמה.\nהחזרה לעבר מדגישה כמה השתנו הילדים.", ""], ["Chapter Forty-five", "המצב מגיע לשיאו. אדה וג'יימי נמצאים בסכנה, וסוזן מבינה עד כמה היא אוהבת אותם וכמה היא רוצה שהם יהיו איתה.", "סוזן כבר אינה רואה בילדים אחריות שנכפתה עליה.\nהיא מבינה שהם הפכו למשפחה שלה.", ""], ["Chapter Forty-six", "סוזן מוצאת את אדה וג'יימי בלונדון לאחר ההפצצות. היא מבינה שהם שייכים אליה ושהיא אינה מוכנה לוותר עליהם. היא מחליטה להילחם כדי להשאיר אותם איתה.\nאדה מבינה שסוזן באמת אוהבת אותה, ושהיא אינה צריכה להוכיח את ערכה כדי להיות ראויה לאהבה.", "זהו סיום שמדגיש את המשמעות של משפחה שנבנית מתוך אהבה ודאגה.\nאדה עוברת מילדה שמרגישה חסרת ערך לילדה שמבינה שהיא אהובה וחשובה.\nהמלחמה, שהייתה אמורה להיות מקור לסכנה, היא גם זו שאפשרה לאדה לצאת מהחיים הקשים שלה.", ""]], "chapters_en": [["Chapter One", "Ada Smith lives with her mother, Mam, and her little brother Jamie in a small London flat. Ada was born with a deformed foot, and her mother is ashamed of her and treats her cruelly. She hits Ada, keeps her inside, and humiliates her.\nAda spends most of her time alone while Jamie goes outside to play with other children.", "Ada suffers physical and emotional abuse.\nHer mother makes her believe she has no value because of her foot.\nAda feels trapped and alone.\nFrom the beginning, she is shown to be strong and determined despite her difficult life.", "Important for the test: understand Ada's starting point"], ["Chapter Two", "Ada realizes Jamie is becoming more distant from her. Afraid of being alone, she tries to stop him from leaving and even ties him up so he cannot escape.\nWhen she sees how frightened he is, she realizes she is acting like their mother. She lets him go and decides she must learn to walk by herself.", "Ada loves Jamie, but her fear of being alone makes her act wrongly.\nShe realizes she does not want to become cruel like her mother.\nLearning to walk is the beginning of her change.\nHer personal war is against fear, loneliness, and the limitations forced on her.", ""], ["Chapter Three", "Ada begins practicing walking. She holds onto a chair and tries to stand and take steps, but every attempt causes pain and falls. Her foot bleeds and she becomes exhausted, but she keeps trying.\nShe hides the practice from her mother and hopes that one day she will be able to walk like everyone else.", "Ada shows courage, determination, and persistence.\nShe wants to prove to her mother that she can do things.\nWalking represents independence and freedom.\nShe still believes that if she changes, her mother might love her.", ""], ["Chapter Four", "Ada keeps practicing, but her mother discovers what she is doing and punishes her. She locks Ada in the cupboard under the sink, a dirty place filled with cockroaches.\nAt the same time, London children are going to be evacuated to the countryside because of the danger of German bombing. Mam decides to send Ada and Jamie mainly because she wants to get rid of the expense of raising them.", "Mam does not send the children out of genuine concern, but for her own interests.\nAda is still being abused.\nThe war begins changing the children's lives.\nThe event everyone fears is about to become Ada's chance to escape.", ""], ["Chapter Five", "Ada and Jamie prepare for the journey. Ada does not know what to expect and is afraid of the outside world because she has barely left the flat for years.\nShe understands that evacuation will separate her from the only place she knows, but it may also allow her to become free.", "Ada faces a huge and unfamiliar change.\nShe is afraid, but also curious.\nThe bond between Ada and Jamie is very important: they support each other.", ""], ["Chapter Six", "The children arrive at the railway station with the other children being evacuated from London. Ada feels different from the others, especially because of her foot and because she has no clothes or belongings like theirs.\nShe sees a girl riding a pony, and the sight creates a dream in her: she wants to ride a pony too.", "The evacuation marks the beginning of Ada's new life.\nThe pony becomes a symbol of freedom and new possibilities.\nAda begins imagining a future different from the life she knew.", ""], ["Chapter Seven", "Ada and Jamie arrive in the countryside and discover that the woman who is supposed to take them, Susan Smith, does not want children. She was not prepared for them and does not know how to care for them.\nEven so, Ada and Jamie stay with her. Ada discovers that Susan has a large house, a bathtub, and food—things she did not have in London.", "Susan does not want responsibility for the children at first.\nShe is not like Ada's mother, but she does not yet know how to show affection.\nAda finds it hard to believe someone might help her without hurting her.", ""], ["Chapter Eight", "Susan discovers Ada's physical condition and that her foot was never properly treated. She takes the children to a doctor, who explains that Ada has clubfoot and that her condition is the result of neglect.\nThe doctor recommends treatment and crutches. Ada discovers that she can move with the crutches without hurting her injured foot.", "Ada realizes her foot is not her fault.\nSusan begins caring for her health.\nThe crutches give Ada independence she never had before.\nTreatment is an important step toward both physical and emotional recovery.", ""], ["Chapter Nine", "Ada begins exploring her new surroundings. She discovers the yard, nature, and a pony named Butter. She grows close to him and feels comfortable with him.\nShe also begins getting used to being allowed outside and exploring the world.", "Butter becomes a source of happiness and safety for Ada.\nLife in the countryside is very different from the closed flat in London.\nAda begins to understand that she can do things for herself.", ""], ["Chapter Ten", "Ada and Susan continue adjusting to living together. Susan takes care of food, cleaning, and the children's needs, even though she still struggles with the responsibility.\nAda begins to see that Susan is not like her mother, but she is still afraid to trust her.", "The relationship between Ada and Susan begins to change.\nSusan learns how to care for children, and Ada learns to accept help.\nTheir trust develops gradually, not all at once.", ""], ["Chapter Eleven", "Ada begins getting to know the village and its people. She discovers that there are people willing to help her and treat her with respect, unlike what she experienced in London.", "Ada begins to feel part of the world.\nShe learns that not everyone is cruel.\nHer confidence begins to grow.", ""], ["Chapter Twelve", "Ada continues learning to use crutches and move on her own. She discovers that her new life requires effort, but also gives her opportunities she never had before.", "Independence is one of the central themes.\nAda does not give up despite difficulties.\nShe begins to see herself as capable.", ""], ["Chapter Thirteen", "Ada grows closer to Butter and learns to know him. Their relationship gives her a feeling of freedom and happiness. She begins believing she can do things that once seemed impossible.", "Butter represents the freedom Ada receives.\nHer bond with the pony helps build confidence.\nAda begins daring to dream.", ""], ["Chapter Fourteen", "Ada begins learning and discovering a world beyond the limited experiences she had at home. She discovers new things about herself and her abilities.", "Education and learning are part of Ada's freedom.\nShe begins catching up on what neglect kept her from learning.\nShe is not defined only by her disability.", ""], ["Chapter Fifteen", "Ada begins forming relationships with other people in the village. She learns that people value her for who she is, not because of her physical condition.", "Social connections help Ada grow.\nShe begins escaping the shame her mother placed on her.\nShe learns she deserves friendship and respect.", ""], ["Chapter Sixteen", "Ada improves at riding and at caring for Butter. She learns to face new challenges and feels proud of her successes.", "Ada becomes more independent.\nRiding proves that her disability does not prevent her from living a full life.\nShe begins believing in herself.", ""], ["Chapter Seventeen", "Ada continues adjusting to Susan's home. Their relationship becomes more complicated: Susan cares for her, but Ada struggles to believe that the care is real and permanent.", "Ada's trauma affects how she understands love and care.\nShe is afraid to become attached to Susan because she believes her stay may be temporary.", ""], ["Chapter Eighteen", "Ada begins realizing she can be good at many things. She improves in learning, riding, and everyday life.", "Ada's change is not only physical but emotional.\nHer feeling of worthlessness begins changing into a feeling of ability.", ""], ["Chapter Nineteen", "Ada continues experiencing life in the countryside and developing relationships with Susan and the people around her. She begins feeling that she belongs, but still fears everything will end if her mother takes her back.", "The fear of returning to London continues affecting Ada.\nShe still struggles to believe she deserves happiness.", ""], ["Chapter Twenty", "Ada continues moving forward in her new life. She learns more about the world, people, and herself while also dealing with painful memories from home.", "Ada's past still affects her behavior.\nRecovery from trauma takes time.\nSusan's support is important to her development.", ""], ["Chapter Twenty-one", "Ada continues learning and gaining new skills. She begins understanding that life can be more than survival and fear.", "Ada begins building an independent identity.\nShe learns to value her abilities.", ""], ["Chapter Twenty-two", "Ada struggles with her relationship with Susan and with the fear of losing her new home. She is still unsure whether Susan truly wants her.", "Ada finds it hard to accept love because of how her mother treated her.\nSusan must learn how to deal with Ada's fears.", ""], ["Chapter Twenty-three", "Ada continues developing her skills and independence. She begins feeling able to handle situations that once frightened her.", "Ada's progress comes from persistence and the opportunities she was given.\nShe begins believing her future can be different.", ""], ["Chapter Twenty-four", "Ada has complicated feelings: she wants to stay with Susan, but still feels tied to her mother and hopes her mother will love her.", "Ada still searches for her mother's love even though her mother hurts her.\nThe book shows how difficult it is to leave an abusive family relationship.", ""], ["Chapter Twenty-five", "Ada continues building her new life. She learns to understand herself and her feelings and begins realizing that family does not have to mean only the people you are born to.", "Love can be built outside a biological family.\nSusan gradually becomes a mother figure for Ada.", ""], ["Chapter Twenty-six", "Ada continues making progress, but memories of the past and fear of the future still follow her.", "Ada's change is not a straight line: there are moments of progress and moments of fear.\nIt is important to understand how abuse affected her confidence.", ""], ["Chapter Twenty-seven", "Ada continues learning and experiencing life in the countryside. She becomes more confident in herself and in her ability to face the world.", "Ada is no longer the helpless girl from the beginning.\nShe develops courage and independence.", ""], ["Chapter Twenty-eight", "Ada deepens her relationships with the people around her. She learns to accept help while also standing up for herself.", "Independence does not mean doing everything alone.\nAda learns that she can be strong and still accept help.", ""], ["Chapter Twenty-nine", "Ada continues worrying that her good life is temporary. She tries to understand what her future will be and what will happen if her mother demands that she return.", "The fear of losing safety continues to follow Ada.\nHer relationship with Susan becomes more meaningful.", ""], ["Chapter Thirty", "Ada continues learning about life and herself. She begins recognizing that she deserves a good life, although she still finds it difficult to fully believe it.", "Ada's self-worth grows gradually.\nThe book emphasizes education, love, and support.", ""], ["Chapter Thirty-one", "Ada continues living during World War II. The war affects everyday life in the countryside, food, and everyone's sense of safety.", "The war is the story's central background, but the story also focuses on the characters' personal struggles.\nLife in the countryside is not without danger.", ""], ["Chapter Thirty-two", "Ada faces the new reality of war and changes in family life. She continues becoming independent and learning how to deal with difficulties.", "Ada becomes emotionally stronger.\nShe learns to deal with situations she cannot control.", ""], ["Chapter Thirty-three", "Ada continues building her relationship with Susan. She begins understanding that Susan's care is real, although it is still difficult for her to trust it completely.", "Trust is one of the important themes in Ada's development.\nSusan learns to love the children even though she never planned to be a mother.", ""], ["Chapter Thirty-four", "Ada moves forward in her new life while continuing to deal with memories and fears from the past.", "She begins understanding that she does not have to live according to what her mother said about her.\nThe past does not have to determine her future.", ""], ["Chapter Thirty-five", "Ada continues experiencing her special connection with Butter and with the people in the village. She becomes more independent and feels that she belongs.", "Butter represents the freedom and security Ada found.\nAda discovers she can overcome many limitations.", ""], ["Chapter Thirty-six", "Ada faces new events during the war. She discovers that her courage is not only about dealing with her own difficulties, but also about being able to help others.", "Ada begins seeing herself as someone who can contribute.\nShe changes from a girl afraid of the world into a girl able to act within it.", ""], ["Chapter Thirty-seven", "Ada continues dealing with the security situation and changes in her life. She learns to be brave even when she does not know what will happen next.", "Courage is not the absence of fear, but the ability to act despite fear.\nAda develops emotionally.", ""], ["Chapter Thirty-eight", "Ada continues dealing with the difficulties of wartime and the fear of returning to her old life.", "She now knows what freedom and love feel like, so losing them is harder to imagine.\nHer relationship with Susan is especially important.", ""], ["Chapter Thirty-nine", "Ada continues moving forward, but the war and her family history still affect her.", "The book connects the external war with Ada's internal struggle.\nShe learns to face difficult situations without giving up.", ""], ["Chapter Forty", "Ada approaches a turning point. She is no longer the girl she was at the beginning and can face challenges in a more mature way.", "Ada's transformation is one of the book's central messages.\nShe has learned that she deserves love and respect.", ""], ["Chapter Forty-one", "Ada continues dealing with the harsh reality of war and decisions about her future.", "Ada wants to protect the new life she has built.\nShe can now understand more clearly what is good for her and what puts her at risk.", ""], ["Chapter Forty-two", "The situation becomes more tense, and the children must face the possibility that their lives will change again.", "The security Ada found in the countryside is tested.\nShe must face old fears.", ""], ["Chapter Forty-three", "Ada faces events that test her courage and loyalty to the people she loves.", "Ada no longer acts only from fear.\nShe can make decisions out of love and responsibility.", ""], ["Chapter Forty-four", "Ada and Jamie must face a return to the harsh reality they tried to escape. Their bond and what they learned while living with Susan are put to the test.", "Ada and Jamie depend on each other, but Ada increasingly understands that she can protect herself.\nReturning to the past shows how much the children have changed.", ""], ["Chapter Forty-five", "The situation reaches its climax. Ada and Jamie are in danger, and Susan realizes how much she loves them and how much she wants them to be with her.", "Susan no longer sees the children as an imposed responsibility.\nShe understands that they have become her family.", ""], ["Chapter Forty-six", "Susan finds Ada and Jamie in London after the bombings. She understands that they belong with her and that she is not willing to give them up. She decides to fight to keep them with her.\nAda understands that Susan truly loves her and that she does not need to prove her worth in order to deserve love.", "This ending emphasizes a family built through love and care.\nAda changes from a girl who feels worthless into a girl who knows she is loved and important.\nThe war, which was supposed to be a source of danger, is also what allowed Ada to escape her difficult life.", ""]], "summary_he": {"על מה הספר?": "הספר מספר את סיפורה של אדה סמית', ילדה בת כעשר שחיה בלונדון בזמן מלחמת העולם השנייה. אדה נולדה עם עיוות בכף הרגל, ואמה, המכונה Mam, מתביישת בה ומתייחסת אליה באכזריות. היא כולאת אותה בבית, מונעת ממנה לצאת החוצה ומשפילה אותה. בגלל היחס של אמה, אדה מאמינה שהיא ילדה חסרת ערך ושאף אחד לא יכול לאהוב אותה.\n\nאדה חיה עם אחיה הקטן ג'יימי, שהוא האדם הקרוב אליה ביותר. כאשר מתחילות ההכנות לפינוי ילדים מלונדון בגלל ההפצצות הגרמניות, אמה מחליטה לשלוח את ג'יימי לכפר. אדה מבינה שאם לא תצטרף אליו, היא תישאר לבדה עם אמה, ולכן מחליטה לברוח מהבית ולהצטרף אליו, למרות שמעולם לא יצאה מהדירה.", "החיים החדשים בכפר": "אדה וג'יימי מגיעים לכפר ונשלחים לגור אצל אישה בשם סוזן סמית'. בתחילה סוזן אינה מעוניינת לטפל בילדים, והיא עצמה מתמודדת עם אובדן אישי ועם קשיים רגשיים. היא לא יודעת כיצד להתנהג עם ילדים, במיוחד עם אדה, שמפחדת מאנשים ומתקשה לסמוך על אחרים.\n\nבהדרגה סוזן מתחילה לדאוג להם. היא נותנת להם אוכל, בגדים, מקום לישון וטיפול רפואי. היא לוקחת את אדה לרופא, שמסביר לה שהבעיה ברגלה נובעת ממצב רפואי שלא טופל כראוי, ולא משום שהיא עשתה משהו רע.\n\nבבית החדש אדה מתחילה לגלות את העולם. היא לומדת לקרוא, לכתוב ולנוע בעזרת קביים. היא גם מגלה את Butter, פוני שהופך לחלק חשוב מאוד בחייה. אדה לומדת לרכוב עליו, והדבר מעניק לה תחושת חופש ועצמאות שלא הכירה קודם.", "השינוי של אדה": "ככל שעובר הזמן, אדה משתנה מאוד. בתחילת הספר היא מפחדת כמעט מכל דבר, מאמינה שהיא חסרת ערך ומנסה כל הזמן לרצות את אמה כדי לזכות באהבתה.\n\nבכפר היא מגלה שהיא מסוגלת ללמוד, להתקדם ולהצליח. היא יוצרת קשרים עם אנשים חדשים, לומדת להתמודד עם קשיים ומתחילה להאמין בעצמה.\n\nעם זאת, השינוי אינו פשוט. אדה עדיין נושאת איתה את הפחדים והזיכרונות מההתעללות שעברה. היא מתקשה להאמין שסוזן באמת אוהבת אותה, וחוששת שיום אחד ייקחו אותה ממנה ויחזירו אותה ללונדון.\n\nגם סוזן משתנה. בתחילת הסיפור היא אינה רוצה להיות אם לילדים, אך בהדרגה היא נקשרת לאדה ולג'יימי ומבינה שהם הפכו למשפחה שלה.", "המלחמה והמרגל הגרמני": "במהלך הספר המלחמה ממשיכה להשפיע על חיי הדמויות. אדה מגלה שהיא מסוגלת לתרום ולעזור לאחרים, ולא רק לקבל עזרה.\n\nבאחד האירועים החשובים בסיפור, אדה מבחינה בהתנהגות חשודה של אדם שמתגלה כמרגל גרמני. בזכות תשומת הלב והאומץ שלה, היא עוזרת לחשוף אותו ולמנוע ממנו להמשיך בפעילותו. האירוע גורם לאנשים בכפר להעריך אותה, והיא מבינה שהיא יכולה להיות אמיצה ובעלת חשיבות.", "חזרתה של האם": "לאחר תקופה שבה אדה וג'יימי חיים עם סוזן, אמם מגיעה לכפר ולוקחת אותם בחזרה ללונדון. היא אינה מבינה עד כמה הילדים השתנו ואינה מתייחסת אליהם באהבה ובדאגה שהם זקוקים להן.\n\nאדה נאלצת לעזוב את סוזן ואת החיים החדשים שבנתה. היא מבינה שהחזרה לאמה פירושה חזרה לפחד, להתעללות ולחוסר החופש.\n\nבזמן שהילדים נמצאים שוב בלונדון, העיר מופצצת. אדה וג'יימי נמצאים בסכנה, והמצב מגיע לנקודת שיא.", "הסיום": "סוזן מבינה שהיא אינה מסוגלת לוותר על אדה וג'יימי. היא יוצאת לחפש אותם בלונדון, ולבסוף מוצאת אותם בין ההריסות לאחר ההפצצות.\n\nהיא מחליטה להחזיר אותם אליה ולהילחם על כך שיוכלו להישאר איתה. היא כבר אינה רואה בהם ילדים שהיא נאלצה לטפל בהם, אלא את המשפחה שלה.\n\nבסוף הספר אדה מבינה שהיא אינה ילדה פגומה או חסרת ערך. היא ראויה לאהבה, לכבוד ולחיים טובים. היא גם מבינה שמשפחה אינה בהכרח רק האנשים שאליהם נולדים, אלא גם האנשים שבוחרים לאהוב ולדאוג לנו."}, "summary_en": {"About the book": "The book tells the story of Ada Smith, a girl about ten years old living in London during World War II. Ada was born with a deformed foot, and her mother, called Mam, is ashamed of her and treats her cruelly. She keeps Ada inside, prevents her from going outside, and humiliates her. Because of her mother's treatment, Ada believes she is worthless and that nobody can love her.\n\nAda lives with her little brother Jamie, who is the person closest to her. When preparations begin to evacuate children from London because of German bombing, Mam decides to send Jamie to the countryside. Ada realizes that if she does not go with him, she will be left alone with her mother, so she decides to escape and join him, even though she has never left the flat.", "New life in the countryside": "Ada and Jamie arrive in the countryside and are sent to live with a woman named Susan Smith. At first Susan does not want to care for children and is dealing with her own emotional difficulties. She does not know how to behave with children, especially Ada, who is afraid of people and struggles to trust others.\n\nGradually Susan begins caring for them. She gives them food, clothes, a place to sleep, and medical care. She takes Ada to a doctor, who explains that Ada's foot problem is a medical condition that was never properly treated, not something Ada did wrong.\n\nIn her new home, Ada begins discovering the world. She learns to read and write and to move with crutches. She also discovers Butter, a pony who becomes very important in her life. Ada learns to ride him, giving her a sense of freedom and independence she never knew before.", "Ada's change": "As time passes, Ada changes greatly. At the beginning of the book she is afraid of almost everything, believes she is worthless, and constantly tries to please her mother in order to earn her love.\n\nIn the countryside she discovers that she can learn, improve, and succeed. She makes new connections, learns to deal with difficulties, and begins believing in herself.\n\nThe change is not simple. Ada still carries fears and memories from the abuse. She struggles to believe Susan really loves her and worries that someone will take her away and return her to London.\n\nSusan changes too. At first she does not want to be a mother to children, but gradually she becomes attached to Ada and Jamie and realizes they have become her family.", "The war and the German spy": "Throughout the book, the war continues to affect the characters' lives. Ada discovers that she can contribute and help other people, not only receive help.\n\nIn one important event, Ada notices suspicious behavior from a man who turns out to be a German spy. Through her attention and courage, she helps expose him and stop his activity. The event makes people in the village value her, and she realizes she can be brave and important.", "Her mother's return": "After Ada and Jamie have lived with Susan for some time, their mother comes to the countryside and takes them back to London. She does not understand how much the children have changed and does not treat them with the love and care they need.\n\nAda is forced to leave Susan and the new life she built. She realizes that returning to her mother means returning to fear, abuse, and lack of freedom.\n\nWhile the children are back in London, the city is bombed. Ada and Jamie are in danger, and the situation reaches its climax.", "The ending": "Susan realizes she cannot give up Ada and Jamie. She goes to London to find them and eventually finds them among the ruins after the bombings.\n\nShe decides to bring them back and fight so they can stay with her. She no longer sees them as children she was forced to care for, but as her family.\n\nAt the end of the book, Ada understands that she is not a broken or worthless child. She deserves love, respect, and a good life. She also understands that family is not only the people we are born to, but also the people who choose to love and care for us."}, "characters_he": [["אדה סמית' (Ada Smith)", "הדמות הראשית. ילדה אמיצה וחכמה שעוברת התעללות מצד אמה. במהלך הספר היא לומדת להיות עצמאית, להתמודד עם פחדיה ולהאמין בעצמה."], ["סוזן סמית' (Susan Smith)", "האישה שמקבלת את אדה וג'יימי בכפר. בתחילה היא אינה רוצה ילדים, אך בהדרגה הופכת לדמות אימהית ואוהבת עבורם."], ["ג'יימי (Jamie)", "אחיה הקטן של אדה. הוא אוהב אותה וקשור אליה, אך לעיתים מתקשה להבין את הפחדים שלה. הקשר ביניהם חשוב לאורך כל הסיפור."], ["Butter", "הפוני שאדה נקשרת אליו ולומדת לרכוב עליו. הוא מסמל עבורה חופש, עצמאות ויכולת להתגבר על מגבלות."], ["Mam – אמה של אדה", "אישה אכזרית שמתעללת באדה ומזניחה אותה. היא גורמת לאדה להאמין שהיא אינה ראויה לאהבה."]], "characters_en": [["Ada Smith", "The main character. A brave and intelligent girl who suffers abuse from her mother. Throughout the book she learns independence, faces her fears, and believes in herself."], ["Susan Smith", "The woman who takes Ada and Jamie in the countryside. At first she does not want children, but gradually becomes a loving mother figure."], ["Jamie", "Ada's little brother. He loves her and is close to her, although he sometimes struggles to understand her fears. Their relationship is important throughout the story."], ["Butter", "The pony Ada becomes attached to and learns to ride. He represents freedom, independence, and overcoming limitations."], ["Mam – Ada's mother", "A cruel woman who abuses and neglects Ada and makes her believe she is not worthy of love."]], "themes_he": [["חופש ועצמאות", "אדה יוצאת מהדירה הסגורה, לומדת ללכת, רוכבת על Butter ומחליטה יותר ויותר בעצמה."], ["משפחה ואהבה", "סוזן הופכת למשפחה שאדה וג'יימי זקוקים לה, למרות שאינה אמם הביולוגית."], ["התמודדות עם טראומה", "אדה מתקשה לסמוך על אנשים בגלל ההתעללות שעברה, אך בהדרגה לומדת לקבל אהבה."], ["קבלת העצמי", "אדה מבינה שהרגל שלה אינה הופכת אותה לפחות טובה או פחות ראויה מאחרים."], ["אומץ", "אדה מתמודדת עם פחדים, לומדת דברים חדשים ואף עוזרת לחשוף מרגל."], ["מלחמה", "המלחמה מביאה סכנה והרס, אך הפינוי גם מאפשר לאדה לברוח מחייה הקשים ולמצוא בית חדש."]], "themes_en": [["Freedom and independence", "Ada leaves the closed flat, learns to move, rides Butter, and increasingly makes choices for herself."], ["Family and love", "Susan becomes the family Ada and Jamie need even though she is not their biological mother."], ["Dealing with trauma", "Ada struggles to trust people because of the abuse she experienced, but gradually learns to accept love."], ["Self-acceptance", "Ada learns that her foot does not make her less worthy than anyone else."], ["Courage", "Ada faces fears, learns new things, and even helps expose a spy."], ["War", "The war brings danger and destruction, but evacuation also allows Ada to escape her difficult life and find a new home."]], "key_he": ["בתחילת הספר: אדה חיה בפחד, סובלת מהתעללות ומאמינה שהיא חסרת ערך.", "הפינוי: המלחמה מאפשרת לה לצאת מלונדון ולהגיע לכפר.", "סוזן: בתחילה אינה רוצה ילדים, אך הופכת לאדם שאוהב ודואג לאדה ולג'יימי.", "Butter: מסמל חופש ועצמאות ועוזר לאדה להאמין ביכולותיה.", "השינוי של אדה: מילדה מפוחדת וחסרת ביטחון לילדה אמיצה, עצמאית ובטוחה יותר בעצמה.", "המרגל: אדה מוכיחה שהיא מסוגלת לעזור לאחרים ולפעול באומץ.", "חזרת האם: מדגישה את ההבדל בין משפחה ביולוגית לבין משפחה שמעניקה אהבה וביטחון.", "הסיום: סוזן בוחרת באדה ובג'יימי, ואדה מבינה שהיא ראויה לאהבה."], "key_en": ["At the beginning: Ada lives in fear, suffers abuse, and believes she is worthless.", "The evacuation: The war allows her to leave London and reach the countryside.", "Susan: At first she does not want children, but becomes someone who loves and cares for Ada and Jamie.", "Butter: He represents freedom and independence and helps Ada believe in her abilities.", "Ada's change: She grows from a frightened, insecure girl into a braver and more confident one.", "The spy: Ada proves she can help others and act courageously.", "Her mother's return: It highlights the difference between biological family and a family that provides love and safety.", "The ending: Susan chooses Ada and Jamie, and Ada understands that she deserves love."], "quote_he": "The War That Saved My Life הוא סיפור על ילדה שעוברת מהתעללות וחוסר חופש לחיים של אהבה, עצמאות וקבלה עצמית. הספר מלמד שמשפחה אמיתית אינה נקבעת רק לפי קשר דם, אלא לפי אהבה, דאגה והבחירה להיות שם בשביל מישהו.", "quote_en": "The War That Saved My Life is a story about a girl who moves from abuse and lack of freedom to a life of love, independence, and self-acceptance. The book teaches that a real family is not defined only by blood, but by love, care, and choosing to be there for someone.", "why_he": "המלחמה שהצילה את חיי\n\nמלחמת העולם השנייה גרמה לפינוי ילדים מלונדון, ואפשרה לאדה לצאת מהבית שבו סבלה מהתעללות ומחוסר חופש.\n\nלמרות שהמלחמה עצמה הייתה אירוע נורא ומסוכן, היא יצרה עבור אדה הזדמנות להתחיל חיים חדשים, לקבל טיפול, ללמוד, להכיר אנשים שאוהבים אותה ולגלות את הערך העצמי שלה.\n\nלכן המלחמה \"הצילה\" את חייה לא משום שהייתה טובה, אלא משום שהיא אפשרה לה להימלט מהחיים הקשים שבהם חיה.", "why_en": "The War That Saved My Life\n\nWorld War II caused children to be evacuated from London, allowing Ada to leave the home where she suffered abuse and lack of freedom.\n\nAlthough the war itself was terrible and dangerous, it created an opportunity for Ada to begin a new life, receive treatment, learn, meet people who loved her, and discover her self-worth.\n\nThe war therefore \"saved\" her life not because it was good, but because it allowed her to escape the difficult life she had been living."};

function renderSummary(){
 const keys=lang==='he'?D.summary_he:D.summary_en;$('summaryCards').innerHTML=Object.entries(keys).map(([k,v])=>`<article class="card"><h3>${esc(k)}</h3><p>${esc(v)}</p></article>`).join('');
 const chars=lang==='he'?D.characters_he:D.characters_en;$('characters').innerHTML=chars.map(x=>`<div class="character"><div class="avatar">${esc(x[0][0])}</div><div><b>${esc(x[0])}</b><small>${esc(x[1])}</small></div></div>`).join('');
 const themes=lang==='he'?D.themes_he:D.themes_en;$('themes').innerHTML=themes.map(x=>`<div class="theme"><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join('');
 $('why').textContent=lang==='he'?D.why_he:D.why_en;$('quote').textContent=lang==='he'?D.quote_he:D.quote_en;
}

 const arr=lang==='he'?D.chapters_he:D.chapters_en;const f=filter.toLowerCase();

plot:"The novel tells the story of Ada Smith, a ten-year-old girl born with clubfoot who lives in London with her mother and younger brother, Jamie. Her mother is ashamed of Ada's foot, mistreats her, and keeps her inside the flat most of the time. When children are evacuated from London because of the war, Ada decides to escape with Jamie. They arrive in the countryside and are taken in by Susan Smith, a woman who never planned to raise children but gradually becomes an important person in their lives. In the countryside Ada receives medical care, learns to read and write, rides Butter, meets new people, and begins to understand that she can do much more than her mother made her believe. Throughout the story she still struggles with fear, memories, and the difficulty of believing that people can care for her without hurting her.",
beginning:"At the beginning, Ada lives in a small London flat with Mam and Jamie. She rarely leaves because of her foot and her mother's treatment of her. When children are evacuated from London because of the coming war, Ada decides to take Jamie and leave. They arrive in the countryside, where Susan takes them in even though she does not know how to care for children. This is where Ada's life begins to change.",
middle:"In the countryside, Ada receives treatment for her foot, learns to use crutches, goes to school, and discovers things she never knew before. She becomes close to Butter, learns to ride, and builds relationships with Susan, Jamie, Maggie, and others. At the same time, she still struggles with fear: she believes she must take care of herself, finds it difficult to trust Susan, and worries that her new life will end. When she briefly returns to her mother, she understands how different her life with Susan has become.",
ending:"Near the end, Ada and Jamie are sent back to London and are there during bombing. Susan realizes that she cannot simply let them go and returns to look for them. She finds them, and they return with her. Later Susan insists that they stay with her even while the war continues. Ada is no longer the same girl who left the London flat: she still has fears, but she knows that people care about her and that she deserves a better life.",
conflict:"The central conflict is Ada's struggle between the life she knew and the possibility of a new life. She is still attached to her mother and keeps hoping that her mother will love her, while at the same time she discovers safety, education, and care with Susan. There is also the external conflict of the war, but the novel shows that Ada's fear, abuse, and lack of security are another kind of war.",
characters:[["Ada Smith","The protagonist and narrator. She begins as a girl who believes she is defective and must hide, but gradually becomes independent, brave, and more confident."],["Jamie Smith","Ada's younger brother. Their bond is very strong, and Ada has felt responsible for him for most of her life."],["Susan Smith","The woman who takes Ada and Jamie into her home. At first she does not feel ready to care for children, but she learns to care for them and fights to keep them safe."],["Mam","Ada and Jamie's mother. She treats Ada cruelly because of her foot and strongly affects the way Ada sees herself."],["Maggie Thorton","A girl from a wealthy family whom Ada meets in the countryside. She becomes an important friend and helps Ada experience a different social world."],["Butter","Ada's pony. Ada's relationship with him is connected to freedom, movement, and the confidence she develops."]],
development:"Ada changes greatly. At first she believes that her disability makes her a monster and that she must hide herself. Later, through medical care, education, riding, and supportive relationships, she begins to see herself as capable. The most important change is not only physical; it is the way she thinks about herself and her right to receive love and help.",
themes:[["Freedom and independence","Ada moves from a life in which she is trapped inside a flat to a life where she can move, learn, and make choices."],["Family and love","The novel shows that family can also be a relationship built through care and love, not only biology."],["Trauma and healing","Ada's past affects her ability to trust people and the way she reacts to good and bad experiences."],["Self-worth","Ada learns that her foot does not determine her value and that she deserves respect."],["War","World War II is the background of the story and affects the evacuation, bombing, and lives of the characters."]],
titleMeaning:"The title refers to the way the war caused Ada and Jamie to be evacuated from London. For Ada, the evacuation took her away from the home where she suffered and brought her to Susan, where she received treatment, education, and a chance to live differently. In this ironic sense, a war that was destructive also became part of the reason Ada was saved from her old life.",
message:"The main message, in my opinion, is that a person's past does not have to decide their future. Ada begins the story believing that she has little value, but people who give her a chance help her discover her abilities. The novel also shows how important it is for a person to receive respect, safety, and an opportunity to learn.",
opinion:"I think this is a powerful and interesting book because we see real character growth, not just events connected to the war. I especially liked the way Ada slowly learns to trust Susan and believe in herself. I would recommend the book to readers who enjoy stories about characters who grow and stories that combine emotion, history, and tension.",

}

ending:"לקראת הסוף, אדה וג'יימי נשלחים שוב ללונדון ונמצאים בזמן הפצצות. סוזן מבינה שהיא לא יכולה פשוט לשחרר אותם וחוזרת לחפש אותם. היא מוצאת אותם, והשניים חוזרים איתה. בהמשך סוזן עומדת על כך שהם יישארו איתה, גם כשהמלחמה נמשכת. אדה כבר אינה אותה ילדה שהגיעה מהדירה בלונדון: היא עדיין מתמודדת עם פחדים, אבל היא יודעת שיש אנשים שרוצים בטובתה ושהיא ראויה לחיים טובים.",
conflict:"הקונפליקט המרכזי הוא המאבק של אדה בין החיים שהכירה לבין האפשרות לחיים חדשים. מצד אחד היא קשורה לאמה וממשיכה לקוות שאמא שלה תאהב אותה; מצד שני היא מגלה אצל סוזן ביטחון, חינוך ואהבה. בנוסף יש את המלחמה החיצונית, אבל הספר מדגיש שגם הפחד, ההתעללות וחוסר הביטחון של אדה הם סוג של מלחמה.",
characters:[["אדה סמית'","הגיבורה והמספרת. היא מתחילה כילדה שמאמינה שהיא פגומה וחייבת להסתתר, ובהדרגה נעשית עצמאית, אמיצה ובטוחה יותר."],["ג'יימי סמית'","אחיה הצעיר של אדה. הקשר ביניהם חזק מאוד, ואדה מרגישה שהיא אחראית עליו כמעט כל חייה."],["סוזן סמית'","האישה שמקבלת את אדה וג'יימי בביתה. בהתחלה היא לא מרגישה מוכנה להיות מטפלת, אבל היא לומדת לדאוג להם ונלחמת כדי שישארו איתה."],["Mam","אמה של אדה וג'יימי. היא מתייחסת לאדה באכזריות בגלל הרגל שלה ומשפיעה מאוד על הדרך שבה אדה רואה את עצמה."],["מגי ת'ורטון","ילדה ממשפחה אמידה שאדה מכירה בכפר. היא הופכת לחברה חשובה ועוזרת לאדה להכיר עולם חברתי אחר."],["Butter","הפוני של אדה. הקשר של אדה אליו קשור לחופש, לתנועה ולביטחון שהיא בונה לעצמה."]],
development:"אדה עוברת שינוי גדול. בהתחלה היא חושבת שהמגבלה שלה הופכת אותה ל'מפלצת' ושהיא צריכה להסתיר את עצמה. בהמשך, בזכות הטיפול, הלמידה, הרכיבה והקשרים עם אנשים טובים, היא מתחילה לראות את עצמה כאדם בעל יכולות. השינוי החשוב ביותר הוא לא רק ברגל שלה אלא בדרך שבה היא חושבת על עצמה ועל הזכות שלה לקבל אהבה ועזרה.",
themes:[["חופש ועצמאות","אדה עוברת מחיים שבהם היא כלואה בדירה לחיים שבהם היא יכולה לנוע, ללמוד ולבחור."],["משפחה ואהבה","הספר מראה שמשפחה יכולה להיות גם קשר שנבנה מתוך דאגה ואהבה, ולא רק קשר ביולוגי."],["התמודדות עם טראומה","העבר של אדה משפיע על האמון שלה באנשים ועל הדרך שבה היא מגיבה לדברים טובים ורעים."],["ערך עצמי","אדה לומדת שהרגל שלה אינה קובעת את הערך שלה ושמגיע לה יחס מכבד."],["מלחמה","מלחמת העולם השנייה היא הרקע לסיפור ומשפיעה על הפינוי, ההפצצות והחיים של הדמויות."]],
titleMeaning:"הכותרת מתייחסת לכך שהמלחמה גרמה לפינוי של אדה וג'יימי מלונדון. מבחינת אדה, הפינוי שנוצר בגלל המלחמה הוציא אותה מהבית שבו סבלה והביא אותה לסוזן, שם היא קיבלה טיפול, חינוך ואפשרות לחיות אחרת. לכן מלחמה שהייתה אמורה להיות דבר הרסני הופכת, באופן אירוני, לחלק מהדרך שבה אדה ניצלת מהחיים הקודמים שלה.",
message:"המסר המרכזי בעיניי הוא שהעבר של אדם לא חייב לקבוע את העתיד שלו. אדה התחילה את הסיפור כשהיא חושבת שהיא לא שווה הרבה, אבל אנשים שנתנו לה הזדמנות עזרו לה לגלות את היכולות שלה. הספר גם מראה כמה חשוב שאדם יקבל יחס מכבד, ביטחון והזדמנות ללמוד.",
opinion:"אני חושב שזה ספר חזק ומעניין כי רואים בו שינוי אמיתי של הדמות הראשית ולא רק אירועים של מלחמה. אהבתי במיוחד את הדרך שבה אדה לומדת בהדרגה לסמוך על סוזן ולהאמין בעצמה. הייתי ממליץ על הספר למי שאוהב סיפורים עם דמויות שמתפתחות ושיש בהם גם מתח, רגש והיסטוריה.",
events:["הפינוי של הילדים מלונדון","ההגעה של אדה וג'יימי לבית של סוזן","הטיפול הרפואי ברגל של אדה","ההיכרות של אדה עם Butter והתחלת הרכיבה","ההתקדמות של אדה בבית הספר ובחיים בכפר","החזרה של אדה וג'יימי ללונדון וההפצצות","החיפוש של סוזן אחריהם והחזרה שלהם אליה","ההחלטה של סוזן להילחם כדי שישארו איתה"]

meta:[["Book Title","The War That Saved My Life"],["Author","Kimberly Brubaker Bradley"],["Genre","Historical fiction"],["Period","1939–1940, during World War II"],["Setting","London and the English countryside"],["Narrator","Ada Smith"]],
plot:"The novel tells the story of Ada Smith, a ten-year-old girl born with clubfoot who lives in London with her mother and younger brother, Jamie. Her mother is ashamed of Ada's foot, mistreats her, and keeps her inside the flat most of the time. When children are evacuated from London because of the war, Ada decides to escape with Jamie. They arrive in the countryside and are taken in by Susan Smith, a woman who never planned to raise children but gradually becomes an important person in their lives. In the countryside Ada receives medical care, learns to read and write, rides Butter, meets new people, and begins to understand that she can do much more than her mother made her believe. Throughout the story she still struggles with fear, memories, and the difficulty of believing that people can care for her without hurting her.",
beginning:"At the beginning, Ada lives in a small London flat with Mam and Jamie. She rarely leaves because of her foot and her mother's treatment of her. When children are evacuated from London because of the coming war, Ada decides to take Jamie and leave. They arrive in the countryside, where Susan takes them in even though she does not know how to care for children. This is where Ada's life begins to change.",
middle:"In the countryside, Ada receives treatment for her foot, learns to use crutches, goes to school, and discovers things she never knew before. She becomes close to Butter, learns to ride, and builds relationships with Susan, Jamie, Maggie, and others. At the same time, she still struggles with fear: she believes she must take care of herself, finds it difficult to trust Susan, and worries that her new life will end. When she briefly returns to her mother, she understands how different her life with Susan has become.",
ending:"Near the end, Ada and Jamie are sent back to London and are there during bombing. Susan realizes that she cannot simply let them go and returns to look for them. She finds them, and they return with her. Later Susan insists that they stay with her even while the war continues. Ada is no longer the same girl who left the London flat: she still has fears, but she knows that people care about her and that she deserves a better life.",
conflict:"The central conflict is Ada's struggle between the life she knew and the possibility of a new life. She is still attached to her mother and keeps hoping that her mother will love her, while at the same time she discovers safety, education, and care with Susan. There is also the external conflict of the war, but the novel shows that Ada's fear, abuse, and lack of security are another kind of war.",
characters:[["Ada Smith","The protagonist and narrator. She begins as a girl who believes she is defective and must hide, but gradually becomes independent, brave, and more confident."],["Jamie Smith","Ada's younger brother. Their bond is very strong, and Ada has felt responsible for him for most of her life."],["Susan Smith","The woman who takes Ada and Jamie into her home. At first she does not feel ready to care for children, but she learns to care for them and fights to keep them safe."],["Mam","Ada and Jamie's mother. She treats Ada cruelly because of her foot and strongly affects the way Ada sees herself."],["Maggie Thorton","A girl from a wealthy family whom Ada meets in the countryside. She becomes an important friend and helps Ada experience a different social world."],["Butter","Ada's pony. Ada's relationship with him is connected to freedom, movement, and the confidence she develops."]],
development:"Ada changes greatly. At first she believes that her disability makes her a monster and that she must hide herself. Later, through medical care, education, riding, and supportive relationships, she begins to see herself as capable. The most important change is not only physical; it is the way she thinks about herself and her right to receive love and help.",
themes:[["Freedom and independence","Ada moves from a life in which she is trapped inside a flat to a life where she can move, learn, and make choices."],["Family and love","The novel shows that family can also be a relationship built through care and love, not only biology."],["Trauma and healing","Ada's past affects her ability to trust people and the way she reacts to good and bad experiences."],["Self-worth","Ada learns that her foot does not determine her value and that she deserves respect."],["War","World War II is the background of the story and affects the evacuation, bombing, and lives of the characters."]],
titleMeaning:"The title refers to the way the war caused Ada and Jamie to be evacuated from London. For Ada, the evacuation took her away from the home where she suffered and brought her to Susan, where she received treatment, education, and a chance to live differently. In this ironic sense, a war that was destructive also became part of the reason Ada was saved from her old life.",
message:"The main message, in my opinion, is that a person's past does not have to decide their future. Ada begins the story believing that she has little value, but people who give her a chance help her discover her abilities. The novel also shows how important it is for a person to receive respect, safety, and an opportunity to learn.",
opinion:"I think this is a powerful and interesting book because we see real character growth, not just events connected to the war. I especially liked the way Ada slowly learns to trust Susan and believe in herself. I would recommend the book to readers who enjoy stories about characters who grow and stories that combine emotion, history, and tension.",
events:["The evacuation of children from London","Ada and Jamie arriving at Susan's home","Ada receiving medical treatment for her foot","Ada meeting Butter and beginning to ride","Ada's progress at school and in countryside life","Ada and Jamie returning to London during the bombing","Susan searching for them and bringing them back","Susan deciding to fight to keep them with her"]
}
